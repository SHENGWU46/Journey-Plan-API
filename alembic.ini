# A generic, single database configuration (sync SQLAlchemy).
# Adapted from fastapi学习/AN-API/alembic; DB URL injected by alembic/env.py
# via app.config.get_database_url() (SQLite dev / MySQL prod).

[alembic]
script_location = alembic

# allow alembic to import the project's app package
prepend_sys_path = .

version_path_separator = os

; sqlalchemy.url is set at runtime by env.py, not hardcoded here


[post_write_hooks]

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
